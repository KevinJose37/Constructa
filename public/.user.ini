; ============================================================
; Constructa — Configuración PHP para Producción
; Ubicar en: public_html/.user.ini
; ============================================================

; --- OPcache (elimina recompilación PHP en cada request) ---
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 120
opcache.validate_timestamps = 1
opcache.save_comments = 1

; --- Realpath Cache (acelera resolución de rutas de archivos) ---
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- Límites PHP seguros para shared hosting ---
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 32M
upload_max_filesize = 16M

; --- Sesiones ---
session.gc_maxlifetime = 7200
session.gc_probability = 1
session.gc_divisor = 100

; --- Desactivar funciones peligrosas en producción ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
